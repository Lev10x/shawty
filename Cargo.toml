[package]
name = "shawty"
version = "0.3.1"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
anyhow = {version = "1.0.102", optional = true}
reqwest = {version = "0.13.2", optional = true, features = ["blocking"]}
url = {version = "2.5.8", optional = true}

[features]
default = ["network", "dev"]
network = ["reqwest", "url"]

dev = ["anyhow"]

